name: Laravel CI/CD (cPanel)

# Deploy code workflow qua rsync/SSH (không git push remote cPanel — hay lỗi path/auth)
# stock = source khác — không đụng

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  laravel-tests:
    name: Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, tokenizer, fileinfo, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --force

      - name: Smoke checks + unit tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan about
          php artisan test --testsuite=Unit

  deploy:
    name: Deploy workflow to cPanel
    needs: laravel-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install sshpass + rsync
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Add cPanel host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.CPANEL_SSH_PORT }}" -H "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || \
          ssh-keyscan -p "${{ secrets.CPANEL_SSH_PORT }}" "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Đồng bộ code vào APP_PATH; giữ nguyên .env / storage uploads / vendor (composer trên server)
      - name: Rsync code to workflow (preserve .env)
        env:
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          HOST="${{ secrets.CPANEL_SSH_HOST }}"
          USER="${{ secrets.CPANEL_SSH_USER }}"
          PORT="${{ secrets.CPANEL_SSH_PORT }}"
          APP_PATH="${{ secrets.CPANEL_APP_PATH }}"

          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PORT" ]; then
            echo "ERROR: thiếu CPANEL_SSH_HOST / USER / PORT"
            exit 1
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH="/home/ipoubwkrhosting/workflow"
          fi

          echo "Rsync -> ${USER}@${HOST}:${APP_PATH}/ (port ${PORT})"
          echo "Preserving: .env, storage content, vendor, node_modules"

          # Không --delete để tránh xóa file production (upload/.env/vendor)
          rsync -az \
            -e "sshpass -e ssh -o StrictHostKeyChecking=accept-new -p ${PORT}" \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            --exclude 'storage/app/public/' \
            --exclude 'storage/framework/cache/' \
            --exclude 'storage/framework/sessions/' \
            --exclude 'storage/framework/views/' \
            --exclude 'storage/logs/' \
            --exclude 'tests/' \
            --exclude 'phpunit.xml' \
            --exclude '.github/' \
            ./ "${USER}@${HOST}:${APP_PATH}/"

          echo "Rsync done."

      - name: Composer + migrate + cache on server
        env:
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          APP_PATH="${{ secrets.CPANEL_APP_PATH }}"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="/home/ipoubwkrhosting/workflow"
          fi

          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            bash -s <<REMOTE
          set -euo pipefail
          APP_PATH='$APP_PATH'
          cd "\$APP_PATH"

          if [ ! -f artisan ]; then
            echo "ERROR: artisan not found in \$APP_PATH"
            ls -la
            exit 1
          fi
          if [ ! -f .env ]; then
            echo "ERROR: .env missing — phải giữ .env production trên server"
            exit 1
          fi

          PHP_BIN=\$(command -v php || true)
          if [ -x /usr/local/bin/php ]; then PHP_BIN=/usr/local/bin/php; fi
          for p in /opt/cpanel/ea-php82/root/usr/bin/php /opt/cpanel/ea-php81/root/usr/bin/php /opt/cpanel/ea-php83/root/usr/bin/php; do
            if [ -x "\$p" ]; then PHP_BIN="\$p"; fi
          done
          echo "PHP: \$PHP_BIN"
          "\$PHP_BIN" -v | head -1

          if command -v composer >/dev/null 2>&1; then
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          elif [ -f composer.phar ]; then
            "\$PHP_BIN" composer.phar install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          else
            echo "WARN: composer not found — skip install (dùng vendor hiện có)"
          fi

          "\$PHP_BIN" artisan migrate --force --no-interaction
          "\$PHP_BIN" artisan optimize:clear
          "\$PHP_BIN" artisan config:cache || true
          "\$PHP_BIN" artisan route:cache || true
          "\$PHP_BIN" artisan view:cache || true
          "\$PHP_BIN" artisan storage:link 2>/dev/null || true

          echo "Deploy finished for \$APP_PATH"
          REMOTE
