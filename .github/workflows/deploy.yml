name: Laravel CI/CD (cPanel)

# Chỉ deploy app workflow (error_order_management)
# stock = source khác, người khác maintain — không đụng

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

jobs:
  laravel-tests:
    name: Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, tokenizer, fileinfo, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations (sqlite test DB)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          SESSION_DRIVER: array
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate --force --no-interaction

      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          SESSION_DRIVER: array
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

  deploy:
    name: Deploy workflow to cPanel
    needs: laravel-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Add cPanel host to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.CPANEL_SSH_PORT }}" -H "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push to cPanel Git repository
        env:
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CPANEL_URL="ssh://${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:${{ secrets.CPANEL_SSH_PORT }}${{ secrets.CPANEL_REPO_PATH }}"

          if git remote | grep -qx cpanel; then
            git remote set-url cpanel "$CPANEL_URL"
          else
            git remote add cpanel "$CPANEL_URL"
          fi

          echo "Pushing HEAD -> cpanel main + master (workflow) ..."
          # cPanel thường nhận master; GitHub dùng main — push cả hai ref
          GIT_SSH_COMMAND="sshpass -e ssh -o StrictHostKeyChecking=accept-new -p ${{ secrets.CPANEL_SSH_PORT }}" \
            git push -f cpanel HEAD:main HEAD:master

          echo "Git push to cPanel done."

      - name: Migrate + optimize on workflow app
        env:
          SSHPASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
        run: |
          set -euo pipefail

          APP_PATH="${{ secrets.CPANEL_APP_PATH }}"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="/home/ipoubwkrhosting/workflow"
          fi

          echo "Deploy app path: $APP_PATH (stock is intentionally excluded)"

          sshpass -e ssh -o StrictHostKeyChecking=accept-new \
            -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "set -e
             cd '$APP_PATH'
             if [ ! -f artisan ]; then
               echo 'ERROR: artisan not found in $APP_PATH'
               exit 1
             fi
             if [ ! -f .env ]; then
               echo 'ERROR: .env missing — keep production .env on server'
               exit 1
             fi
             PHP_BIN=\$(command -v php || true)
             if [ -x /usr/local/bin/php ]; then PHP_BIN=/usr/local/bin/php; fi
             if [ -x /opt/cpanel/ea-php82/root/usr/bin/php ]; then PHP_BIN=/opt/cpanel/ea-php82/root/usr/bin/php; fi
             if [ -x /opt/cpanel/ea-php81/root/usr/bin/php ]; then PHP_BIN=/opt/cpanel/ea-php81/root/usr/bin/php; fi
             echo \"Using PHP: \$PHP_BIN\"
             if command -v composer >/dev/null 2>&1; then
               composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev || true
             fi
             \$PHP_BIN artisan migrate --force --no-interaction
             \$PHP_BIN artisan optimize:clear
             \$PHP_BIN artisan config:cache || true
             \$PHP_BIN artisan route:cache || true
             \$PHP_BIN artisan view:cache || true
             \$PHP_BIN artisan storage:link 2>/dev/null || true
             echo 'Workflow deploy finished.'"
